<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .section-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
            transition: 0.2s;
        }

        select:focus,
        input[type="number"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .button-container {
            text-align: center;
            margin-top: 35px;
        }

        .predict-btn {
            border: none;
            padding: 15px 45px;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.35);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f4f6ff;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #e1e5ff;
        }

        .result h2 {
            color: #555;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #667eea;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 650px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 25px;
            }

            .header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>🎓 Student Performance Prediction</h1>

        <p>
            Enter the student's information to predict their mathematics score.
        </p>

    </div>


    <div class="form-card">

        <div class="section-title">
            Student Information
        </div>


        <form action="/predictdata" method="post">

            <div class="form-grid">


                <!-- Gender -->
                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select id="gender" name="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                    </select>

                </div>


                <!-- Race -->
                <div class="form-group">

                    <label for="race_ethnicity">
                        Race / Ethnicity
                    </label>

                    <select
                        id="race_ethnicity"
                        name="race_ethnicity"
                        required
                    >

                        <option value="">
                            Select Group
                        </option>

                        <option value="group A">
                            Group A
                        </option>

                        <option value="group B">
                            Group B
                        </option>

                        <option value="group C">
                            Group C
                        </option>

                        <option value="group D">
                            Group D
                        </option>

                        <option value="group E">
                            Group E
                        </option>

                    </select>

                </div>


                <!-- Parental Education -->
                <div class="form-group">

                    <label for="parental_level_of_education">
                        Parental Level of Education
                    </label>

                    <select
                        id="parental_level_of_education"
                        name="parental_level_of_education"
                        required
                    >

                        <option value="">
                            Select Education
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>

                    </select>

                </div>


                <!-- Lunch -->
                <div class="form-group">

                    <label for="lunch">
                        Lunch Type
                    </label>

                    <select
                        id="lunch"
                        name="lunch"
                        required
                    >

                        <option value="">
                            Select Lunch Type
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                        <option value="free/reduced">
                            Free / Reduced
                        </option>

                    </select>

                </div>


                <!-- Test Preparation -->
                <div class="form-group">

                    <label for="test_preparation_course">
                        Test Preparation Course
                    </label>

                    <select
                        id="test_preparation_course"
                        name="test_preparation_course"
                        required
                    >

                        <option value="">
                            Select Course
                        </option>

                        <option value="none">
                            None
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- Reading -->
                <div class="form-group">

                    <label for="reading_score">
                        Reading Score
                    </label>

                    <input
                        type="number"
                        id="reading_score"
                        name="reading_score"
                        min="0"
                        max="100"
                        placeholder="Enter reading score"
                        required
                    >

                </div>


                <!-- Writing -->
                <div class="form-group">

                    <label for="writing_score">
                        Writing Score
                    </label>

                    <input
                        type="number"
                        id="writing_score"
                        name="writing_score"
                        min="0"
                        max="100"
                        placeholder="Enter writing score"
                        required
                    >

                </div>

            </div>


            <div class="button-container">

                <button
                    type="submit"
                    class="predict-btn"
                >
                    Predict Math Score 🚀
                </button>

            </div>

        </form>


        {% if results is not none %}

        <div class="result">

            <h2>
                Predicted Mathematics Score
            </h2>

            <div class="score">
                {{ results }}
            </div>

            <p>
                This prediction was generated using your trained
                machine learning model.
            </p>

        </div>

        {% endif %}


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
